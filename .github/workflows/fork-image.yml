# Nur im Fork: baut ein Image aus diesem Branch, damit die evaluate-Action
# genutzt werden kann, solange der Upstream-PR offen ist.
# Bewusst nicht Teil des PR-Branches feat/evaluate-action.
name: Fork Image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag für das Image
        required: false
        default: evaluate
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build_and_push:
    name: Build & Push (amd64)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Compute GHCR owner (lowercase)
        id: ghcr
        shell: bash
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64
          build-args: |
            GIT_COMMIT=${{ github.sha }}
          tags: |
            ghcr.io/${{ steps.ghcr.outputs.owner }}/scrape-dojo:${{ inputs.tag }}
            ghcr.io/${{ steps.ghcr.outputs.owner }}/scrape-dojo:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
